[package]
name = "ora-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Real Oracle backend. Needs Oracle Instant Client at *runtime* only.
oracle = ["dep:oracle"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
oracle = { version = "0.6", optional = true }
