[package]
name = "ora-ide"
version = "0.1.0"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ora-core = { path = "../../crates/ora-core", features = ["oracle"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-updater = { version = "2", optional = true }

[features]
default = []
# In-app updates. Release builds enable it together with tauri.updater.conf.json (public key + endpoint).
updater = ["dep:tauri-plugin-updater"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
